<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bonaventure</title>
<link rel="stylesheet" href="base.css">
<style>
  html, body { background: var(--island); overflow: hidden; }
  body { color: #fff; }
  .view { position: absolute; inset: 0; display: none; opacity: 0; transition: opacity .18s ease .08s; }
  .view.show { display: flex; opacity: 1; }
  @starting-style { .view.show { opacity: 0; } }

  /* ---- collapsed pill ---- */
  #pill { align-items: center; gap: 9px; padding: 0 16px 0 15px; }
  #pill .name { font-weight: 600; font-size: 13px; letter-spacing: -0.01em; }
  #pill .sub { margin-left: auto; color: rgba(255,255,255,.5); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  #pill:hover .sub { color: rgba(255,255,255,.85); }

  .glyph { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #5AC8FA, #0A84FF 60%, #0040A8); box-shadow: 0 0 10px rgba(10,132,255,.55); flex: none; }
  .glyph.busy { animation: breathe 1.4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(.78); box-shadow: 0 0 2px rgba(10,132,255,.3); } }

  /* ---- expanded common ---- */
  .panel { flex-direction: column; padding: 14px 16px 14px; bottom: auto; }
  .hdr { display: flex; align-items: center; gap: 8px; height: 22px; }
  .hdr .name { font-weight: 600; font-size: 13px; }
  .hdr .right { margin-left: auto; display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,.45); font-size: 11.5px; }
  .chev { width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(255,255,255,.1); color: rgba(255,255,255,.75); display: grid; place-items: center; }
  .chev:hover { background: rgba(255,255,255,.18); color: #fff; }

  /* ---- intake ---- */
  .tiles { display: grid; grid-template-columns: 1fr 1fr 1.35fr; gap: 10px; margin-top: 12px; height: 132px; }
  .tile { position: relative; background: #1C1C1E; border-radius: 14px; padding: 12px; overflow: hidden; display: flex; flex-direction: column; transition: background .15s, box-shadow .15s; }
  .tile.drop:hover, .tile.over { background: #2C2C2E; }
  .tile.over { box-shadow: inset 0 0 0 1.5px var(--blue); }
  .tile .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: rgba(255,255,255,.08); color: rgba(255,255,255,.8); }
  .tile .ic svg { width: 16px; height: 16px; }
  .tile .t { margin-top: auto; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .s { font-size: 11.5px; color: rgba(255,255,255,.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .ok { color: var(--green); } .tile .warn { color: var(--yellow); } .tile .err { color: var(--red); }
  .tile.filled .bg { position: absolute; inset: 0; background: center/cover no-repeat; opacity: .38; }
  .tile.filled .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(28,28,30,0) 20%, #1C1C1E 92%); }
  .tile > * { position: relative; }
  .tile .x { position: absolute; top: 9px; right: 9px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: rgba(255,255,255,.75); font-size: 13px; line-height: 1; display: none; }
  .tile.filled:hover .x { display: block; }
  .docs { margin-top: 6px; display: flex; flex-direction: column; gap: 2px; }
  .docs div { font-size: 11.5px; color: rgba(255,255,255,.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile textarea { flex: 1; margin-top: 8px; padding-right: 34px; resize: none; border: 0; outline: 0; background: transparent; color: #fff; font: inherit; font-size: 13px; line-height: 1.4; padding: 0; user-select: text; }
  .tile textarea::placeholder { color: rgba(255,255,255,.35); }
  .foot { display: flex; align-items: center; margin-top: 12px; gap: 14px; }
  .status { display: flex; gap: 14px; font-size: 11.5px; color: rgba(255,255,255,.5); }
  .status span { display: inline-flex; align-items: center; gap: 6px; }
  .hint { font-size: 11.5px; color: rgba(255,255,255,.45); margin-left: auto; }
  .go { height: 30px; padding: 0 18px; border-radius: 15px; border: 0; background: #fff; color: #000; font-weight: 600; font-size: 13px; }
  .go:hover { background: #E8E8ED; }
  .go:disabled { background: rgba(255,255,255,.14); color: rgba(255,255,255,.35); }

  .mic { position: absolute; right: 10px; bottom: 10px; width: 30px; height: 30px; border-radius: 15px; border: 0; background: rgba(255,255,255,.1);
    color: rgba(255,255,255,.8); display: grid; place-items: center; }
  .mic:hover { background: rgba(255,255,255,.18); color: #fff; }
  .mic.rec { background: #FF453A; color: #fff; animation: pulse 1.2s ease-in-out infinite; }
  .mic.busy { opacity: .5; pointer-events: none; }
  .mic svg { width: 15px; height: 15px; }
  /* ---- processing ---- */
  .step { margin-top: 14px; font-size: 17px; font-weight: 600; letter-spacing: -0.015em; }
  .step .n { color: rgba(255,255,255,.4); font-weight: 500; font-size: 13px; margin-left: 6px; }
  .bar { margin-top: 12px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 2px; background: #fff; transition: width .45s ease; }
  .ticks { display: flex; gap: 4px 10px; margin-top: 10px; white-space: nowrap; font-size: 11px; color: rgba(255,255,255,.4); flex-wrap: wrap; }
  .ticks span.done { color: rgba(255,255,255,.75); }
  .ticks span.run { color: #fff; }

  /* ---- error ---- */
  .etitle { margin-top: 12px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
  .etitle i { width: 20px; height: 20px; border-radius: 50%; background: var(--red); display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 800; }
  .emsg { margin-top: 4px; color: rgba(255,255,255,.7); }
  .ecauses { margin-top: 6px; font-size: 12px; color: rgba(255,255,255,.5); }
  .edetails { margin-top: 8px; font-family: var(--mono); font-size: 10.5px; color: rgba(255,255,255,.55); background: #1C1C1E; border-radius: 8px; padding: 8px; max-height: 70px; overflow: auto; white-space: pre-wrap; user-select: text; display: none; }
  .edetails.show { display: block; }
  .eacts { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
  .link { background: none; border: 0; color: #64B5FF; font-size: 12px; padding: 0; margin-top: 6px; text-align: left; }
</style>
</head>
<body>

<!-- collapsed -->
<div class="view show" id="pill" onclick="expand()">
  <span class="glyph" id="glyph"></span><span class="name">Bonaventure</span>
  <span class="sub" id="pillSub">New case <svg class="i" viewBox="0 0 16 16" style="width:12px;height:12px"><path d="M4 6l4 4 4-4"/></svg></span>
</div>

<!-- intake -->
<div class="view panel" id="intake">
  <div class="hdr"><span class="glyph"></span><span class="name">Bonaventure</span>
    <span class="right"><span>Drop a scan or records anywhere</span><button class="chev" onclick="collapse()" title="Collapse (Esc)"><svg class="i" viewBox="0 0 16 16" style="width:12px;height:12px"><path d="M4 10l4-4 4 4"/></svg></button></span></div>
  <div class="tiles">
    <div class="tile drop" id="scanTile" data-kind="scan"></div>
    <div class="tile drop" id="histTile" data-kind="history"></div>
    <div class="tile" id="sympTile">
      <div class="ic"><svg class="i" viewBox="0 0 16 16"><path d="M3 4h10M3 8h10M3 12h6"/></svg></div>
      <textarea id="symptoms" placeholder="Type or dictate the presentation, in your own words"></textarea>
      <button class="mic" title="Dictate" onclick="toggleMic(this, 'symptoms')"><svg class="i" viewBox="0 0 16 16"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3 8a5 5 0 0010 0M8 13v2"/></svg></button>
    </div>
  </div>
  <div class="foot">
    <div class="status"><span><i class="dot" id="dImg"></i><span id="tImg">Imaging</span></span><span><i class="dot" id="dRsn"></i><span id="tRsn">Reasoning</span></span></div>
    <span class="hint" id="hint"></span>
    <button class="go" id="go" disabled onclick="analyse()">Analyse</button>
  </div>
</div>

<!-- processing -->
<div class="view panel" id="proc">
  <div class="hdr"><span class="glyph busy"></span><span class="name" id="procCase">Case</span><span class="right" id="procCount"></span></div>
  <div class="step" id="procStep">Preparing clinical evidence</div>
  <div class="bar"><i id="procBar"></i></div>
  <div class="ticks" id="procTicks"></div>
</div>

<!-- error -->
<div class="view panel" id="err">
  <div class="hdr"><span class="glyph"></span><span class="name" id="errCase">Bonaventure</span></div>
  <div class="etitle"><i>!</i><span id="eTitle"></span></div>
  <div class="emsg" id="eMsg"></div>
  <div class="ecauses" id="eCauses"></div>
  <button class="link" onclick="toggleDetails()">View technical details</button>
  <pre class="edetails" id="eDetails"></pre>
  <div class="eacts"><button class="pb" onclick="resetLauncher(); expand()">Start over</button><button class="go" onclick="analyse()">Retry</button></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const SIZES = { pill: [340, 40], intake: [660, 0], proc: [580, 0], err: [560, 0] };  // 0 = measure content
const ICON = {
  scan: '<svg class="i" viewBox="0 0 16 16"><rect x="2.5" y="2" width="11" height="12" rx="2"/><path d="M8 4.5v7M5.5 6.5c-1 .5-1.5 2-1.2 3.5M10.5 6.5c1 .5 1.5 2 1.2 3.5M6 8h4"/></svg>',
  doc: '<svg class="i" viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4z"/><path d="M9 2v3h3M6 8.5h4M6 11h4"/></svg>',
};
let view = "pill", scan = null, histories = [], lastSymptoms = "", currentCase = null;

function show(v) {
  view = v;
  document.querySelectorAll(".view").forEach((el) => el.classList.toggle("show", el.id === v));
  const [w, h] = SIZES[v];
  pywebview.api.island(w, h || Math.ceil($(v).getBoundingClientRect().height));
  if (v === "intake") setTimeout(() => $("symptoms").focus(), 250);
}
function expand() { if (view === "pill") show("intake"); }
function collapse() { show("pill"); }
window.expand = expand;
window.toggleIsland = () => (view === "pill" ? show("intake") : view === "intake" ? collapse() : null);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && view === "intake") collapse(); });

// ---------- intake tiles ----------
function render() {
  const st = $("scanTile");
  st.classList.toggle("filled", !!(scan && scan.ok));
  st.innerHTML = !scan
    ? `<div class="ic">${ICON.scan}</div><div class="t">Chest X-ray</div><div class="s">Drop or click · PNG, JPEG, DICOM</div>`
    : scan.ok
      ? `<div class="bg" style="background-image:url('${scan.thumb}')"></div><button class="x" onclick="event.stopPropagation(); clearScan()">×</button>
         <div class="ic">${ICON.scan}</div><div class="t">${esc(scan.view)}</div><div class="s">${esc(scan.dims)} · ${esc(scan.size)}</div>
         <div class="s ${scan.quality === "acceptable" ? "ok" : "warn"}">${scan.quality === "acceptable" ? "✓ Ready" : "⚠ " + esc(scan.warnings[0] || "Quality limited")}</div>`
      : `<div class="ic">${ICON.scan}</div><div class="t">${esc(scan.name)}</div><div class="s err">${esc(scan.error)}</div>`;
  st.onclick = () => pick("scan");

  const ht = $("histTile"), ok = histories.filter((h) => h.ok);
  ht.classList.toggle("filled", histories.length > 0);
  ht.innerHTML = !histories.length
    ? `<div class="ic">${ICON.doc}</div><div class="t">Patient history</div><div class="s">PDF or text · optional</div>`
    : `<div class="ic">${ICON.doc}</div><button class="x" onclick="event.stopPropagation(); clearHistory()">×</button>
       <div class="docs">${histories.slice(0, 3).map((h) => `<div>${h.ok ? (h.has_text ? "✓" : "⚠") : "✕"} ${esc(h.name)}${h.ok ? ` · ${h.pages}p` : ""}</div>`).join("")}${histories.length > 3 ? `<div>+${histories.length - 3} more</div>` : ""}</div>
       <div class="t">${ok.length} document${ok.length === 1 ? "" : "s"}</div><div class="s">${ok.reduce((a, h) => a + h.pages, 0)} pages · click to add</div>`;
  ht.onclick = () => pick("history");

  const ready = scan && scan.ok;
  $("go").disabled = !ready;
  $("hint").textContent = !ready ? "Add a chest X-ray to begin" : ok.length ? "" : "No history — context support limited";
}

function bindDrops() {
  document.querySelectorAll(".tile.drop").forEach((t) => {
    t.ondragover = (e) => { e.preventDefault(); t.classList.add("over"); };
    t.ondragleave = () => t.classList.remove("over");
  });
  // never resize the window during a drag: on Wayland a moving/resizing target cancels the drop. Highlight instead.
  let dragDepth = 0;
  document.addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
  document.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
  document.addEventListener("dragover", (e) => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = "copy"; });
  // files are delivered by Python (pywebview reads the real path); the page only shows the drop target
  document.addEventListener("drop", (e) => {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
    document.querySelectorAll(".tile.over").forEach((t) => t.classList.remove("over"));
    // the files themselves arrive natively (app.py reads the drop's URI list); nothing to do here
  });
}


// ---------- dictation: press to record, press again to transcribe (offline Whisper) ----------
async function toggleMic(btn, target) {
  if (btn.classList.contains("rec")) {
    btn.classList.remove("rec"); btn.classList.add("busy");
    const r = await pywebview.api.stop_dictation();
    btn.classList.remove("busy");
    if (r.text) { const t = document.getElementById(target); t.value = (t.value ? t.value.trimEnd() + " " : "") + r.text; t.dispatchEvent(new Event("input")); }
    else if (r.error) btn.title = r.error;
    return;
  }
  const r = await pywebview.api.start_dictation();
  if (r.error) { btn.title = r.error; return; }
  btn.classList.add("rec");
}

window.onFilesStaged = (staged) => {
  expand();
  for (const s of staged) {
    if (s.kind === "scan") scan = s.items[0];
    else histories.push(...s.items);
  }
  render();
};

async function pick(kind) {
  if (kind === "scan") { const s = await pywebview.api.pick_scan(); if (s) scan = s; }
  else histories.push(...(await pywebview.api.pick_history()));
  render();
}
function clearScan() { scan = null; pywebview.api.clear_scan(); render(); }
function clearHistory() { histories.forEach((h) => h.id && pywebview.api.remove_history(h.id)); histories = []; render(); }

// ---------- engine status ----------
const ENGINE = {
  imaging: { ready: "Imaging ready", loading: "Loading imaging", mock: "Imaging · demo", unavailable: "Imaging unavailable" },
  reasoning: { ready: "Reasoning ready", loading: "Loading reasoning", mock: "Reasoning · demo", unavailable: "Reasoning off" },
};
async function pollEngine() {
  const s = await pywebview.api.engine_status();
  $("dImg").className = "dot " + s.imaging; $("tImg").textContent = ENGINE.imaging[s.imaging] || s.imaging;
  $("dRsn").className = "dot " + s.reasoning; $("tRsn").textContent = ENGINE.reasoning[s.reasoning] || s.reasoning;
  const loading = Object.values(s).includes("loading");
  $("glyph").classList.toggle("busy", loading);
  setTimeout(pollEngine, loading ? 800 : 4000);
}

// ---------- analysis ----------
async function analyse() {
  lastSymptoms = $("symptoms").value || lastSymptoms;
  const r = await pywebview.api.analyze(lastSymptoms);
  if (r.error) { $("hint").textContent = r.error; return; }
  currentCase = r.case_id;
  $("procCase").textContent = "Case " + r.case_id;
  show("proc");
  poll(r.case_id);
}

async function poll(id) {
  const p = await pywebview.api.progress(id);
  const total = p.steps.length, done = p.steps.filter((s) => s.state === "complete" || s.state === "skipped").length;
  const run = p.steps.find((s) => s.state === "running");
  $("procCount").textContent = `${Math.min(done + 1, total)} of ${total}`;
  $("procStep").innerHTML = run ? `${esc(run.label)}…` : done === total ? "Review ready" : "Preparing clinical evidence";
  $("procBar").style.width = `${((done + (run ? 0.5 : 0)) / total) * 100}%`;
  const before = $("proc").getBoundingClientRect().height;
  $("procTicks").innerHTML = p.steps.map((s) => `<span class="${s.state === "complete" ? "done" : s.state === "running" ? "run" : ""}">${s.state === "complete" ? "✓" : s.state === "running" ? "●" : "○"} ${esc(s.label.split(" ")[0])}</span>`).join("");
  const after = $("proc").getBoundingClientRect().height;   // content grew (steps wrapped)? grow the island with it
  if (Math.abs(after - before) > 1 && view === "proc") pywebview.api.island(SIZES.proc[0], Math.ceil(after));
  if (p.state === "REVIEW_READY") {
    $("procStep").textContent = "Review ready";
    $("procBar").style.width = "100%";
    return setTimeout(() => {
      pywebview.api.open_review(id);
      $("pillSub").innerHTML = `${esc(id)} · in review`;
      collapse();
    }, 650);
  }
  if (p.state === "FAILED") return showError(p.error, id);
  setTimeout(() => poll(id), 250);
}

function showError(e, id) {
  $("errCase").textContent = "Case " + id;
  $("eTitle").textContent = e.title; $("eMsg").textContent = e.message;
  $("eCauses").textContent = e.causes.length ? "Possible causes: " + e.causes.join(" · ") : "";
  $("eDetails").textContent = e.details; $("eDetails").classList.remove("show");
  show("err");
}
function toggleDetails() {
  $("eDetails").classList.toggle("show");
  pywebview.api.island(SIZES.err[0], Math.ceil($("err").getBoundingClientRect().height));
}

window.resetLauncher = () => {
  scan = null; histories = []; lastSymptoms = ""; $("symptoms").value = "";
  window.pywebview && pywebview.api.clear_intake();
  $("pillSub").innerHTML = `New case <svg class="i" viewBox="0 0 16 16" style="width:12px;height:12px"><path d="M4 6l4 4 4-4"/></svg>`;
  render();
  if (view !== "intake") collapse();
};

window.addEventListener("pywebviewready", () => { render(); bindDrops(); pollEngine(); pywebview.api.island(...SIZES.pill); });
render();
</script>
</body>
</html>
