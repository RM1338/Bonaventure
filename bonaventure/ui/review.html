<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bonaventure — Review</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Same material as the island: pure black, #1C1C1E tiles, Inter, white pill actions, system status colours. */
  @font-face { font-family: "Caveat"; src: url("fonts/caveat.woff2") format("woff2"); font-weight: 400 700; }
  :root { --tile: #1C1C1E; --tile-2: #2C2C2E; --line: rgba(255,255,255,.08); --t1: #fff; --t2: rgba(255,255,255,.62); --t3: rgba(255,255,255,.4);
          --marker: #FFB21E; --marker-red: #FF453A; }
  html, body { background: #000; overflow: hidden; color: var(--t1); }
  .app { position: fixed; inset: 0; transform-origin: 50% 0; animation: grow .5s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes grow { from { transform: scale(.94) translateY(-14px); opacity: 0; border-radius: 40px; } to { transform: none; opacity: 1; } }

  /* window controls + case line, top-left */
  .top { position: fixed; z-index: 6; top: 16px; left: 18px; display: flex; align-items: center; gap: 16px; }
  .lights { display: flex; gap: 8px; }
  .lights button { width: 12px; height: 12px; border-radius: 50%; border: 0; padding: 0; font-size: 9px; line-height: 1; color: transparent; font-weight: 800; }
  .lights:hover button { color: rgba(0,0,0,.55); }
  .l-close { background: #FF5F57; } .l-min { background: #3A3A3C; } .l-zoom { background: #28C840; }
  .case { display: flex; align-items: center; gap: 9px; font-size: 13px; }
  .glyph { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #5AC8FA, #0A84FF 60%, #0040A8); box-shadow: 0 0 10px rgba(10,132,255,.55); }
  .case b { font-weight: 600; } .case span { color: var(--t3); }

  /* ---------- film ---------- */
  .stagewrap { position: fixed; top: 58px; bottom: 74px; left: var(--lm, 24px); right: 412px; display: grid; place-items: center; transition: left .3s ease; }
  .stagewrap.drag { cursor: grabbing; }
  .stage { position: relative; transform-origin: center; }
  .stage img { display: block; width: 100%; height: 100%; border-radius: 14px; -webkit-user-drag: none; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 14px; pointer-events: none; opacity: .5; display: none; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .qbar { position: fixed; z-index: 5; top: 60px; left: calc(var(--lm, 24px) + (100vw - var(--lm, 24px) - 412px) / 2); transform: translateX(-50%); display: none;
    padding: 7px 14px; border-radius: 16px; background: var(--tile); font-size: 12.5px; color: #FFD60A; }
  .qbar.poor { color: #FF6961; }
  .ctl { position: fixed; z-index: 5; bottom: 22px; left: calc(var(--lm, 24px) + (100vw - var(--lm, 24px) - 412px) / 2); transform: translateX(-50%);
    display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 20px; background: var(--tile); transition: left .3s ease; }
  .ctl button { height: 30px; padding: 0 12px; border: 0; border-radius: 15px; background: transparent; color: var(--t2); font-size: 12.5px; font-weight: 500; }
  .ctl button:hover { color: #fff; background: rgba(255,255,255,.08); }
  .ctl button.on { color: #fff; background: rgba(255,255,255,.14); }
  .ctl .z { font-size: 12px; color: var(--t3); width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
  .ctl .sep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; }

  /* grease pencil */
  .mark { cursor: pointer; }
  .mark path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .mark .ink { stroke: var(--marker); filter: drop-shadow(0 0 1px rgba(0,0,0,.9)); }
  .mark.red .ink { stroke: var(--marker-red); }
  .mark .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .mark text { font-family: "Caveat", cursive; font-weight: 700; fill: var(--marker); paint-order: stroke; stroke: rgba(0,0,0,.85); opacity: 0; animation: ink .4s ease-out forwards; }
  .mark.red text { fill: var(--marker-red); }
  @keyframes ink { to { opacity: 1; } }
  .mark.dim { opacity: .55; } .mark.dim:hover { opacity: 1; }
  .mark.approx .ink { stroke-dasharray: none; opacity: .8; }
  .mark.approx path.draw { stroke-dasharray: 1; }
  .ctl button:disabled { opacity: .3; pointer-events: none; }
  .raw polygon, .raw rect { fill: rgba(10,132,255,.14); stroke: #0A84FF; stroke-dasharray: 5 4; }
  .raw text { fill: #64B5FF; font-family: var(--mono); paint-order: stroke; stroke: #000; }

  /* ---------- right column of tiles ---------- */
  .col { position: fixed; z-index: 4; top: 16px; right: 16px; bottom: 16px; width: 380px; display: flex; flex-direction: column; gap: 10px; }
  .tile { background: var(--tile); border-radius: 20px; padding: 16px; }
  .k { font-size: 11.5px; color: var(--t3); font-weight: 500; }
  .fl { margin: 8px -8px 0; }
  .fr { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 12px; cursor: pointer; }
  .fr:hover { background: rgba(255,255,255,.05); }
  .fr.sel { background: var(--tile-2); }
  .fr .n { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; background: rgba(255,255,255,.08); color: var(--t2); flex: none; }
  .fr.sel .n { background: #fff; color: #000; }
  .fr .nm { font-size: 14px; font-weight: 500; }
  .fr .st { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--t2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .d-SUPPORTED { background: #30D158; } .d-CONFLICTING { background: #FF453A; } .d-UNCERTAIN { background: #FFD60A; } .d-INSUFFICIENT_EVIDENCE { background: #636366; }

  .fl { max-height: 34vh; overflow-y: auto; }
  .sub-h { font-size: 11.5px; color: var(--t3); margin: 10px 8px 2px; }
  .fr.other { cursor: default; }
  .fr.other .nm { font-weight: 400; color: var(--t2); }
  .na { background: rgba(255,159,10,.08); border: 1px solid rgba(255,159,10,.28); }
  .na .k { color: #FFB340; }
  .na h3 { margin: 4px 0 0; font-size: 15px; font-weight: 600; }
  .na .why { font-size: 12px; color: var(--t3); margin-top: 3px; }
  .na p { margin: 8px 0 0; font-size: 13px; line-height: 1.45; color: rgba(255,255,255,.86); }
  .focus { flex: 1; min-height: 0; overflow-y: auto; }
  .idbar { position: fixed; z-index: 6; top: 58px; left: calc(var(--lm, 24px) + (100vw - var(--lm, 24px) - 412px) / 2); transform: translateX(-50%); max-width: 58vw;
    padding: 9px 16px; border-radius: 16px; background: rgba(255,69,58,.16); border: 1px solid rgba(255,69,58,.45); color: #FF9C94; font-size: 13px; display: none; }
  .idbar b { color: #FF6961; }
  .iv .row { display: grid; grid-template-columns: 96px 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .iv .row:first-of-type { border-top: 0; }
  .chg { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 2px 7px; border-radius: 8px; justify-self: start; align-self: start; }
  .chg-NEW { color: #FF9F0A; background: rgba(255,159,10,.14); } .chg-KNOWN { color: var(--t2); background: rgba(255,255,255,.08); }
  .chg-NOT { color: #64D2FF; background: rgba(100,210,255,.12); }
  .iv .q { display: block; font-size: 11.5px; color: var(--t3); margin-top: 2px; }
  .rj { display: grid; grid-template-columns: 18px 1fr; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .rj:first-of-type { border-top: 0; }
  .rj .x { color: #FF453A; font-weight: 700; } .rj .by { font-size: 11.5px; color: var(--t3); margin-top: 2px; }
  .focus h2 { margin: 2px 0 0; font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
  .verdict { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--t2); }
  .say { margin: 12px 0 0; font-size: 14px; line-height: 1.45; color: rgba(255,255,255,.86); }
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .chip { background: var(--tile-2); border-radius: 14px; padding: 10px 11px; cursor: pointer; border: 1px solid transparent; transition: border-color .15s; }
  .chip:hover { border-color: rgba(255,255,255,.14); }
  .chip .lbl { font-size: 11.5px; color: var(--t3); }
  .chip .val { margin-top: 3px; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .c-for { color: #30D158; } .c-against { color: #FF453A; } .c-none { color: var(--t3); }
  .readers { display: flex; gap: 14px; margin-top: 14px; flex-wrap: wrap; font-size: 12px; color: var(--t2); }
  .readers span { display: inline-flex; align-items: center; gap: 6px; }
  .more { margin-top: 14px; width: 100%; height: 32px; border-radius: 16px; border: 0; background: var(--tile-2); color: var(--t2); font-size: 12.5px; font-weight: 500; }
  .more:hover { color: #fff; }
  .verdictrow { display: flex; gap: 8px; margin-top: 10px; }
  .verdictrow button { flex: 1; height: 30px; border-radius: 15px; border: 0; background: var(--tile-2); color: var(--t2); font-size: 12.5px; font-weight: 500; }
  .verdictrow button:hover { color: #fff; }
  .override { margin-top: 10px; padding: 9px 12px; border-radius: 12px; background: rgba(10,132,255,.12); color: #8DC4FF; font-size: 12.5px; line-height: 1.4; }
  .seg2 { display: flex; gap: 8px; margin: 12px 0; }
  .seg2 button { flex: 1; height: 34px; border-radius: 17px; border: 1px solid var(--line); background: var(--tile-2); color: var(--t2); font-size: 13px; }
  .seg2 button.on { background: #fff; color: #000; }
  .note { width: 100%; min-height: 70px; resize: vertical; background: var(--tile-2); border: 0; border-radius: 12px; color: #fff; padding: 10px 12px; font: inherit; font-size: 13px; user-select: text; outline: none; }
  .disc h4 { margin: 14px 0 4px; font-size: 12px; color: var(--t3); font-weight: 500; }
  .disc li { font-size: 13px; line-height: 1.45; color: rgba(255,255,255,.86); margin: 3px 0; }
  .disc .lean { margin-top: 12px; font-size: 14px; line-height: 1.45; }
  .disc .res { margin-top: 8px; font-size: 13px; color: #FFB340; }
  .mic { position: absolute; right: 8px; bottom: 8px; width: 30px; height: 30px; border-radius: 15px; border: 0; background: rgba(255,255,255,.1);
    color: rgba(255,255,255,.8); display: grid; place-items: center; }
  .mic:hover { background: rgba(255,255,255,.18); color: #fff; }
  .mic.rec { background: #FF453A; color: #fff; animation: pulse 1.2s ease-in-out infinite; }
  .mic.busy { opacity: .5; pointer-events: none; }
  .mic.starting { pointer-events: auto; }
  .mic svg { width: 15px; height: 15px; }
  textarea.live { color: rgba(255,255,255,.62); }
  .notewrap { position: relative; }
  @keyframes pulse { 50% { opacity: .55; } }
  .ev { display: none; margin-top: 12px; }
  .ev.open { display: block; }
  .ev .g { margin-top: 12px; }
  .ev .g:first-child { margin-top: 0; }
  .ev .gk { font-size: 11.5px; color: var(--t3); margin-bottom: 4px; }
  .li { display: flex; gap: 10px; font-size: 13px; line-height: 1.4; color: rgba(255,255,255,.82); padding: 4px 0; }
  .li .b { width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; flex: none; }
  .b-for { background: #30D158; } .b-against { background: #FF453A; } .b-note { background: #FFD60A; } .b-none { border: 1.2px solid var(--t3); }
  .li .r { margin-left: auto; padding-left: 8px; color: var(--t3); font-size: 11.5px; white-space: nowrap; }
  .li .src { display: block; color: #64B5FF; font-size: 11.5px; cursor: pointer; }
  .li .src:hover { text-decoration: underline; }
  .li i { color: rgba(255,255,255,.95); }
  .alert { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(255,69,58,.12); color: #FF8A82; font-size: 13px; line-height: 1.4; }

  .imp p { margin: 6px 0 0; font-size: 13.5px; line-height: 1.45; color: rgba(255,255,255,.86); }
  .acts { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
  .go { height: 32px; padding: 0 18px; border-radius: 16px; border: 0; background: #fff; color: #000; font-weight: 600; font-size: 13px; }
  .go:hover { background: #E8E8ED; }
  .ghost { height: 32px; padding: 0 14px; border-radius: 16px; border: 0; background: var(--tile-2); color: var(--t2); font-size: 13px; font-weight: 500; }
  .ghost:hover { color: #fff; }
  .acts .grow { flex: 1; }
  .acts button { white-space: nowrap; }
  .links { display: flex; gap: 16px; margin-top: 10px; }
  .links a { font-size: 12px; color: var(--t3); cursor: pointer; }
  .links a:hover { color: #fff; }
  .fine { margin-top: 10px; font-size: 11px; color: var(--t3); }

  /* ---------- patient context drawer (hidden until asked for) ---------- */
  .ctx { position: fixed; z-index: 4; top: 58px; bottom: 16px; left: 16px; width: 320px; transform: translateX(-360px); transition: transform .3s cubic-bezier(.2,.8,.2,1); overflow-y: auto; }
  body.ctxopen .ctx { transform: none; }
  body.ctxopen { --lm: 352px; }
  .ctx .x { float: right; border: 0; background: var(--tile-2); color: var(--t2); width: 24px; height: 24px; border-radius: 50%; }
  .quote { margin-top: 8px; font-size: 14px; line-height: 1.45; color: rgba(255,255,255,.86); }
  .sym { display: flex; justify-content: space-between; padding: 5px 8px; margin: 0 -8px; border-radius: 9px; font-size: 13px; color: var(--t2); transition: background .25s; }
  .sym.neg { color: var(--t3); text-decoration: line-through; text-decoration-color: rgba(255,255,255,.25); }
  .sym .d { color: var(--t3); font-size: 12px; }
  .how { font-size: 11px; color: var(--t3); text-decoration: none; margin-top: 1px; }
  .unk { font-size: 13px; color: #FFB340; padding: 3px 0; }
  .hx { padding: 7px 8px; margin: 0 -8px; border-radius: 10px; cursor: pointer; transition: background .25s; }
  .hx:hover { background: rgba(255,255,255,.05); }
  .hx .dt { font-size: 11.5px; color: var(--t3); }
  .hx .lb { font-size: 13.5px; font-weight: 500; }
  .hx .sr { font-size: 11.5px; color: var(--t3); }
  .hl { background: rgba(255,178,30,.13) !important; color: #fff !important; text-decoration: none !important; }
  .sec { margin-top: 18px; }
  .muted { font-size: 13px; color: var(--t3); margin-top: 6px; }

  /* ---------- overlays ---------- */
  #links { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
  #links path { fill: none; stroke: var(--marker); stroke-width: 1.3; stroke-dasharray: 4 4; opacity: .85; }
  #links circle { fill: var(--marker); }
  .pop { position: fixed; z-index: 40; width: 340px; background: var(--tile-2); border-radius: 18px; padding: 16px; display: none; box-shadow: 0 24px 60px rgba(0,0,0,.7); }
  .pop h3 { margin: 4px 0 2px; font-size: 16px; font-weight: 600; }
  .pop .m { font-size: 12px; color: var(--t3); }
  .pop blockquote { margin: 12px 0; padding: 10px 12px; background: rgba(0,0,0,.35); border-radius: 10px; font-size: 13px; line-height: 1.5; user-select: text; }
  .pop blockquote mark { background: rgba(255,178,30,.3); color: inherit; border-radius: 3px; padding: 0 2px; }
  .menu { position: fixed; z-index: 45; background: var(--tile-2); border-radius: 12px; padding: 5px; box-shadow: 0 14px 40px rgba(0,0,0,.6); display: none; min-width: 150px; }
  .menu button { display: flex; width: 100%; justify-content: space-between; border: 0; background: none; padding: 5px 10px; border-radius: 7px; font-size: 13px; }
  .menu button:hover { background: var(--blue); }
  .modal { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.6); display: none; place-items: center; }
  .modal.show { display: grid; }
  .modal .box { width: 620px; max-height: 82vh; overflow: auto; background: var(--tile); border-radius: 22px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.7); }
  .modal h3 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  .kv { display: grid; grid-template-columns: 1fr auto; margin: 10px 0 14px; background: var(--tile-2); border-radius: 12px; }
  .kv > * { padding: 6px 12px; border-top: 1px solid var(--line); font-size: 12px; }
  .kv > :nth-child(1), .kv > :nth-child(2) { border-top: 0; }
  .kv .kk { color: var(--t2); } .kv .v { font-family: var(--mono); font-size: 11.5px; text-align: right; }
  .modal pre { font-family: var(--mono); font-size: 10.5px; color: var(--t2); white-space: pre-wrap; max-height: 240px; overflow: auto; user-select: text; background: var(--tile-2); padding: 10px; border-radius: 10px; }
  .hud { position: fixed; bottom: 70px; left: 40vw; transform: translateX(-50%) scale(.96); opacity: 0; z-index: 50; background: var(--tile-2); border-radius: 16px; padding: 9px 15px; font-size: 13px; transition: .2s; pointer-events: none; }
  .hud.show { opacity: 1; transform: translateX(-50%); }
  .tip { position: fixed; z-index: 30; pointer-events: none; background: var(--tile-2); border-radius: 10px; padding: 6px 10px; font-size: 12px; display: none; }
  .empty { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; z-index: 80; background: #000; color: var(--t2); }
</style>
</head>
<body>
<div class="app">
  <div class="top pywebview-drag-region">
    <div class="lights">
      <button class="l-close" onclick="pywebview.api.window_close()" title="Close">×</button>
      <button class="l-min" title="Minimise (not available)">–</button>
      <button class="l-zoom" onclick="pywebview.api.window_zoom()" title="Zoom">+</button>
    </div>
    <div class="case"><span class="glyph"></span><b id="caseId">—</b><span id="caseMeta"></span></div>
  </div>

  <div class="qbar" id="qbar"></div>
  <div class="idbar" id="idbar"></div>
  <div class="stagewrap" id="wrap"><div class="stage" id="stage"><img id="img" alt="Medical image"><canvas id="heat" width="8" height="8"></canvas><svg id="ov"></svg></div></div>
  <div class="ctl">
    <button onclick="toggleCtx()" id="ctxBtn">Context</button><span class="sep"></span>
    <button id="wlBtn" onclick="openWL(event)">Window</button>
    <button onclick="zoomBy(0.8)">−</button><span class="z" id="zoomv">100%</span><button onclick="zoomBy(1.25)">+</button><span class="sep"></span>
    <button class="on" id="mkBtn" onclick="toggleMarks()">Marks</button>
    <button id="rawBtn" onclick="toggleRaw()">AI outlines</button>
    <button id="htBtn" onclick="toggleHeat()" title="Occlusion heatmap of the selected finding (H)">Heatmap</button>
  </div>

  <aside class="tile ctx" id="ctxPanel"></aside>

  <div class="col">
    <div class="tile"><div class="k" id="sumLine">Findings</div><div class="fl" id="flist"></div></div>
    <div class="tile focus" id="focus"></div>
    <div id="naSlot"></div>
    <div id="ivSlot"></div>
    <div class="tile">
      <div class="k">Impression</div><div class="imp" id="imp"></div>
      <div class="acts"><button class="ghost" onclick="pywebview.api.new_case()">New case</button><span class="grow"></span><button class="go" onclick="exportReport()">Export report</button></div>
      <div class="links"><a onclick="openTech()">How the models read it</a><a id="rjBtn" onclick="openRejected()">Rejected claims</a></div>
      <div class="fine">Decision support only — review by a qualified clinician is required.</div>
    </div>
  </div>
</div>

<div class="empty" id="empty" style="display:none"><div><h2>No case open</h2><p>Press Super + Alt + B to start one.</p></div></div>
<svg id="links"></svg>
<div class="tip" id="tip"></div>
<div class="pop" id="pop"></div>
<div class="menu" id="wlMenu"></div>
<div class="modal" id="modal" onclick="if (event.target === this) this.classList.remove('show')"><div class="box" id="modalBox"></div></div>
<div class="hud" id="hud"></div>

<script src="dictation.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const STATE = { SUPPORTED: "Supported", UNCERTAIN: "Uncertain", CONFLICTING: "Conflicting", INSUFFICIENT_EVIDENCE: "Insufficient" };
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : s;
const fmtDate = (d) => !d ? "Undated" : d.length === 4 ? d : d.length === 7 ? `${MONTHS[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}` : `${+d.slice(8, 10)} ${MONTHS[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}`;
let showHeat = false;
let C = null, sel = null, showMarks = true, showRaw = false, W = 1, H = 1, firstDraw = true, evOpen = false;
const num = (f) => C.findings.indexOf(f) + 1;
const isRed = (f) => f.status === "CONFLICTING";

// ---------------- load ----------------
window.addEventListener("pywebviewready", async () => {
  const id = await pywebview.api.current_case();
  if (!id) { $("empty").style.display = "grid"; return; }
  C = await pywebview.api.get_case(id);
  const dt = new Date(C.created);
  $("caseId").textContent = C.case_id;
  $("caseMeta").textContent = `${C.scan.view} · ${dt.getDate()} ${MONTHS[dt.getMonth()]} · ${C.created.slice(11, 16)}`;
  const s = C.summary;

function impression() {
  const sup = C.findings.filter((f) => f.status === "SUPPORTED"), con = C.findings.filter((f) => f.status === "CONFLICTING"), unc = C.findings.filter((f) => f.status === "UNCERTAIN");
  const names = (a) => a.map((f) => f.display_name.toLowerCase()).join(", ").replace(/, ([^,]*)$/, " and $1");
  // cite the underlying diagnosis (e.g. heart failure), not the same finding from an earlier report
  const ctx = [...new Set(sup.flatMap((f) => f.history_evidence.filter((e) => e.category === "Diagnosis").map((e) => e.text.toLowerCase())))].slice(0, 1);
  const out = [];
  if (sup.length) out.push(`${cap(names(sup))}${ctx.length ? `, consistent with known ${ctx[0]}` : ""}.`);
  if (con.length) out.push(`${cap(names(con))}: sources disagree — review required.`);
  if (!out.length) out.push(unc.length ? `Possible ${names(unc)}; evidence limited.` : "No sufficiently supported finding.");
  if (C.quality.state !== "acceptable") out.push(`Limited by image quality.`);
  (C.not_assessable || []).forEach((n) => out.push(`${n.name} cannot be assessed on this film — see advice.`));
  return out.map((p) => `<p>${esc(p)}</p>`).join("");
}

// ---------------- film ----------------
let zoom = 1, panX = 0, panY = 0, base = { w: 0, h: 0 }, wl = 0;
const WL = [["Default", "none"], ["Soft tissue", "contrast(1.35) brightness(0.95)"], ["Lung", "contrast(1.7) brightness(1.12)"], ["Bone", "contrast(2.1) brightness(0.9)"], ["Inverted", "invert(1)"]];

}
function setWL(i) { wl = i; $("img").style.filter = WL[i][1]; $("wlBtn").textContent = i ? WL[i][0] : "Window"; $("wlMenu").style.display = "none"; }
// occlusion heatmap: where the image reader's score for the selected finding drops when that part of the film is hidden
function toggleHeat() { showHeat = !showHeat; $("htBtn").classList.toggle("on", showHeat); renderHeat(); }
function renderHeat() {
  const cv = $("heat"), f = sel || (C && C.findings.find((x) => x.heatmap));
  const g = f && f.heatmap && f.heatmap.grid;
  $("htBtn").disabled = !(C && C.findings.some((x) => x.heatmap));
  if (!showHeat || !g) { cv.style.display = "none"; return; }
  const n = g.length; cv.width = n; cv.height = n;
  const ctx = cv.getContext("2d"), im = ctx.createImageData(n, n);
  g.flat().forEach((v, i) => {            // black → deep red → orange → yellow; faint cells stay clear
    const a = v < 0.15 ? 0 : v;
    im.data.set([255 * Math.min(1, a * 1.6), 255 * Math.max(0, a * 1.4 - 0.45), 40 * Math.max(0, a - 0.8) * 5, 255 * a], i * 4);
  });
  ctx.putImageData(im, 0, 0);

}
function toggleMarks() { showMarks = !showMarks; $("mkBtn").classList.toggle("on", showMarks); renderMarks(); }
function toggleRaw() { showRaw = !showRaw; $("rawBtn").classList.toggle("on", showRaw); renderMarks(); }
window.addEventListener("resize", () => C && fit());
$("wrap").addEventListener("wheel", (e) => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.12 : 0.89); }, { passive: false });
$("wrap").addEventListener("dblclick", () => { zoom = 1; panX = panY = 0; applyT(); });
$("wrap").addEventListener("mousedown", (e) => {

  addEventListener("mousemove", mv); addEventListener("mouseup", up);

// ---------------- grease pencil ----------------
function rng(seed) { let s = seed; return () => ((s = (s * 16807) % 2147483647) - 1) / 2147483646; }

function smooth(pts) {
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length - 1; i++) d += ` Q${pts[i][0].toFixed(1)},${pts[i][1].toFixed(1)} ${((pts[i][0] + pts[i + 1][0]) / 2).toFixed(1)},${((pts[i][1] + pts[i + 1][1]) / 2).toFixed(1)}`;

}
function handEllipse(cx, cy, rx, ry, r, pass) {
  const start = r() * Math.PI * 2, turns = 1.06 + r() * 0.08, n = 46, pts = [];
  const p1 = r() * 6, p2 = r() * 6, a1 = 0.035 + r() * 0.03, a2 = 0.02 + r() * 0.02;
  for (let i = 0; i <= n; i++) {

}

  const n = contour.length, cx = contour.reduce((a, p) => a + p[0], 0) / n, cy = contour.reduce((a, p) => a + p[1], 0) / n;
  const off = Math.floor(r() * n), pts = [];

}
const handLine = (x1, y1, x2, y2, r, k) => `M${x1.toFixed(1)},${y1.toFixed(1)} Q${((x1 + x2) / 2 + (r() - 0.5) * 14 * k).toFixed(1)},${((y1 + y2) / 2 + (r() - 0.5) * 14 * k - 8 * k).toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;

}
function renderMarks() {
  if (!C || W === 1) return;
  const k = W / (base.w || W), sw = 2.8 * k, fs = 25 * k;
  let s = "";
  for (const f of C.findings) {
    const L = f.localization;
    if (!L) continue;
    const [bx0, by0, bx1, by1] = L.coordinates;
    if (showRaw && L.type !== "zone") {
      s += L.contour ? `<g class="raw"><polygon points="${L.contour.map(([x, y]) => `${x * W},${y * H}`).join(" ")}" stroke-width="${1.2 * k}"/>` : `<g class="raw"><rect x="${bx0 * W}" y="${by0 * H}" width="${(bx1 - bx0) * W}" height="${(by1 - by0) * H}" stroke-width="${1.2 * k}"/>`;
      s += `<text x="${bx0 * W + 4 * k}" y="${by0 * H - 6 * k}" font-size="${11 * k}" stroke-width="${3 * k}">${f.canonical_name} · ${esc(L.source || "")}</text></g>`;
    }
    if (!showMarks || f.status === "INSUFFICIENT_EVIDENCE") continue;
    const r = rng(seedOf(f.id + C.case_id));
    if (L.type === "zone") {   // no trustworthy model outline: shade the named anatomical zone(s), visibly approximate
      const isSelZ = sel && sel.id === f.id, red = isRed(f) ? "red" : "";
      const ux = (L.coordinates[0] + L.coordinates[2]) / 2 * W, uy = (L.coordinates[1] + L.coordinates[3]) / 2 * H;
      if (!isSelZ) {
        s += `<g class="mark ${red} dim" data-id="${f.id}" onclick="select('${f.id}')"><path class="ink" d="${handEllipse(ux, uy, 15 * k, 15 * k, r, 0)}" stroke-width="${sw * 0.8}"/>
          <text x="${ux}" y="${uy + fs * 0.32}" font-size="${fs * 0.9}" text-anchor="middle" stroke-width="${fs / 6}" style="opacity:1;animation:none">${num(f)}</text></g>`;
        continue;
      }
      s += `<g class="mark approx ${red}" data-id="${f.id}" onmousemove="tip(event,'${f.id}')" onmouseleave="$('tip').style.display='none'">`;
      (L.zone_boxes || [L.coordinates]).forEach((b, zi) => {
        const zx = (b[0] + b[2]) / 2 * W, zy = (b[1] + b[3]) / 2 * H, zrx = (b[2] - b[0]) / 2 * W * 0.92, zry = (b[3] - b[1]) / 2 * H * 0.92;
        s += `<path class="ink ${zi ? "" : "ring"} draw" pathLength="1" style="animation-delay:${0.2 + zi * 0.15}s" d="${handEllipse(zx, zy, zrx, zry, r, 0)}" stroke-width="${sw * 0.8}" stroke-dasharray="0.012 0.008"/>`;
      });
      const lx = Math.min(Math.max(ux, fs * 4), W - fs * 4), ly = Math.max(L.coordinates[1] * H - fs * 0.6, fs * 1.2);
      s += `<text x="${lx}" y="${ly}" font-size="${fs}" text-anchor="middle" stroke-width="${fs / 6}" style="animation-delay:.4s">${num(f)}. ${esc(f.display_name)} <tspan font-size="${fs * 0.6}">(approx. zone)</tspan></text></g>`;
      continue;
    }
    const x0 = bx0 * W, y0 = by0 * H, x1 = bx1 * W, y1 = by1 * H, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const rx = (x1 - x0) / 2 * 1.08, ry = (y1 - y0) / 2 * 1.08;
    const isSel = sel && sel.id === f.id, red = isRed(f) ? "red" : "";
    if (!isSel) {
      const rr = 15 * k;
      s += `<g class="mark ${red} dim" data-id="${f.id}" onclick="select('${f.id}')" onmousemove="tip(event,'${f.id}')" onmouseleave="$('tip').style.display='none'">
        <path class="ink" d="${handEllipse(cx, cy, rr, rr, r, 0)}" stroke-width="${sw * 0.8}"/>
        <text x="${cx}" y="${cy + fs * 0.32}" font-size="${fs * 0.9}" text-anchor="middle" stroke-width="${fs / 6}" style="opacity:1;animation:none">${num(f)}</text></g>`;
      continue;
    }
    const ring1 = L.contour ? handContour(L.contour, r, 0, 0.06) : handEllipse(cx, cy, rx, ry, r, 0);
    const ring2 = L.contour ? handContour(L.contour, r, 1, 0.075) : handEllipse(cx, cy, rx * 0.985, ry * 1.01, r, 1);
    const leftSide = cx < W / 2, lx = leftSide ? Math.max(fs * 0.4, x0 - W * 0.17) : Math.min(W - fs * 0.4, x1 + W * 0.17);
    const ly = Math.min(Math.max(cy - ry * 0.9 - fs * 0.6, fs * 1.4), H - fs);
    const ax = cx + (leftSide ? -rx : rx) * 0.92, ay = cy - ry * 0.35, sx = lx + (leftSide ? fs * 0.3 : -fs * 0.3), sy = ly + fs * 0.35;
    const suffix = f.status === "SUPPORTED" ? "" : f.status === "CONFLICTING" ? " ??" : " ?", d0 = firstDraw ? 0.25 : 0;
    s += `<g class="mark ${red}" data-id="${f.id}" onclick="select('${f.id}')" onmousemove="tip(event,'${f.id}')" onmouseleave="$('tip').style.display='none'">
      <path class="ink ring draw" pathLength="1" style="animation-delay:${d0}s" d="${ring1}" stroke-width="${sw}"/>
      <path class="ink draw" pathLength="1" style="animation-delay:${d0 + 0.1}s" d="${ring2}" stroke-width="${sw * 0.5}" opacity=".65"/>
      <path class="ink draw" pathLength="1" style="animation-delay:${d0 + 0.5}s" d="${handLine(sx, sy, ax, ay, r, k)}" stroke-width="${sw * 0.8}"/>
      <path class="ink draw" pathLength="1" style="animation-delay:${d0 + 0.8}s" d="${arrowHead(ax, ay, sx, sy, k)}" stroke-width="${sw * 0.8}"/>
      <text x="${lx}" y="${ly}" font-size="${fs}" text-anchor="${leftSide ? "start" : "end"}" stroke-width="${fs / 6}" style="animation-delay:${d0 + 0.3}s">${num(f)}. ${esc(f.display_name)}${suffix}</text></g>`;
  }
  $("ov").innerHTML = s;
}
function tip(e, id) {
  const f = C.findings.find((x) => x.id === id), t = $("tip");
  t.innerHTML = `<b>${esc(f.display_name)}</b> · ${STATE[f.status].toLowerCase()}`;
  t.style.display = "block"; t.style.left = e.clientX + 14 + "px"; t.style.top = e.clientY + 14 + "px";
}

// ---------------- models readout ----------------
function openTech() {
  const t = C.technical, kv = (o) => `<div class="kv">${Object.entries(o).map(([k, v]) => `<span class="kk">${esc(k)}</span><span class="v">${esc(v ?? "—")}</span>`).join("")}</div>`;
  let h = `<div class="k">${esc(C.case_id)}</div><h3>How the models read it</h3>`;
  if (sel) { const x = sel.technical; h += kv({ Finding: sel.display_name, "CLEAR score": x.primary_score, "CLEAR thresholds": x.thresholds.join(" / "),
    "CheXzero score": x.verifier_score, Agreement: sel.signals.agreement, Localization: x.localization_source || "none",
    "Context for / against": `${x.support_count} / ${x.against_count}`, State: sel.status }); }
  h += kv(Object.fromEntries([...t.models.map((m) => [cap(m.role), m.model]), ...Object.entries(t.timing).map(([k, v]) => [k, v + " s"]), ["Total", t.total_seconds + " s"]]));
  if (t.top_concepts?.length) h += `<div class="k">CLEAR — closest of 368,294 concepts</div>` + kv(Object.fromEntries(t.top_concepts.map(([c, r, v]) => [`#${r}  ${c}`, v])));
  h += kv(Object.fromEntries([["Image quality", C.quality.state], ...Object.entries(C.quality.metrics)]));
  const raw = (Array.isArray(t.raw_reasoning) ? t.raw_reasoning : [t.raw_reasoning]).filter((x) => typeof x === "string" && x.trim());
  const imageRaw = raw.filter((x) => !x.startsWith("[natural-language understanding]"));
  h += `<div class="k">MedGemma raw output</div>`;
  h += imageRaw.length ? `<pre>${esc(imageRaw.join("\n\n"))}</pre>` : `<div class="muted">No MedGemma image response was saved for this case. Clinical rewriting output is separate below.</div>`;
  const clinicalRaw = raw.filter((x) => x.startsWith("[natural-language understanding]"));
  if (clinicalRaw.length) h += `<div class="k">Clinical rewriting output</div><pre>${esc(clinicalRaw.join("\n\n"))}</pre>`;
  $("modalBox").innerHTML = h; $("modal").classList.add("show");
}


// ---------------- clinician challenges a finding ----------------
let chVerdict = "absent";
function agree() { pywebview.api.record_override(C.case_id, sel.id, "agree", "", null).then((o) => { C.overrides = o; renderFocus(); hud("Recorded: you agree"); }); }
function openChallenge() {
  chVerdict = sel.status === "SUPPORTED" ? "absent" : "present";
  $("modalBox").innerHTML = `<div class="k">Challenge · ${esc(sel.display_name)} · Bonaventure says ${STATE[sel.status].toLowerCase()}</div><h3>What is your read?</h3>
    <div class="seg2"><button id="vAbs" onclick="setV('absent')">It is not there</button><button id="vPre" onclick="setV('present')">It is there</button></div>
    <div class="notewrap"><textarea class="note" id="chNote" placeholder="Why? Type or dictate, e.g. the opacity is breast tissue, not an effusion"></textarea>
      <button class="mic" title="Dictate" onclick="toggleMic(this, 'chNote')"><svg class="i" viewBox="0 0 16 16"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3 8a5 5 0 0010 0M8 13v2"/></svg></button></div>
    <div class="acts"><span class="grow"></span><button class="ghost" onclick="$('modal').classList.remove('show')">Cancel</button><button class="go" id="chGo" onclick="runChallenge()">Discuss with Bonaventure</button></div>
    <div class="disc" id="disc"></div>`;
  setV(chVerdict); $("modal").classList.add("show"); setTimeout(() => $("chNote").focus(), 50);
}
function setV(v) { chVerdict = v; $("vAbs").classList.toggle("on", v === "absent"); $("vPre").classList.toggle("on", v === "present"); }
async function runChallenge() {
  $("chGo").textContent = "Looking again…"; $("chGo").disabled = true;
  const d = await pywebview.api.challenge(C.case_id, sel.id, chVerdict, $("chNote").value);
  const list = (xs) => xs.length ? `<ul>${xs.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="muted">Nothing.</p>`;
  $("disc").innerHTML = `<div class="lean">${esc(d.lean)}</div>
    <h4>Agrees with you</h4>${list(d.agree)}<h4>Points the other way</h4>${list(d.against)}<div class="res">${esc(d.resolve)}</div>
    <div class="acts"><span class="grow"></span><button class="go" onclick='recordChallenge(${JSON.stringify(d).replace(/'/g, "&#39;")})'>Record my verdict</button></div>`;
  $("chGo").textContent = "Discuss again"; $("chGo").disabled = false;
}
async function recordChallenge(d) {
  C.overrides = await pywebview.api.record_override(C.case_id, sel.id, chVerdict, $("chNote").value, d);
  $("modal").classList.remove("show"); renderFocus(); hud("Your verdict is recorded with the case and the report");
}

// ---------------- claims the readers refused ----------------
function openRejected() {
  const r = C.rejected || [];
  $("modalBox").innerHTML = `<div class="k">${esc(C.case_id)}</div><h3>Checked and rejected</h3>
    <p class="muted" style="margin:4px 0 12px">Every claim a model made that another reader or a consistency check refused. None of these reached the findings.</p>`
    + (r.length ? r.map((x) => `<div class="rj"><span class="x">✕</span><span>${esc(x.claim)}<div class="by">${esc(x.by)} — ${esc(x.reason)}</div></span></div>`).join("")
               : `<p class="muted">Nothing was rejected on this film — every reader agreed with what is shown.</p>`);
  $("modal").classList.add("show");
}

// ---------------- export ----------------
async function exportReport() {
  hud("Generating evidence report…");
  const r = await pywebview.api.export_report(C.case_id);
  hud(r.error ? r.error : r.warning ? `${r.warning} Saved ${r.path}` : `Saved ${r.path} — opened in your PDF viewer`, 5000);
}
let hudT;
function hud(msg, ms = 2500) { const t = $("hud"); t.textContent = msg; t.classList.add("show"); clearTimeout(hudT); hudT = setTimeout(() => t.classList.remove("show"), ms); }
</script>
</body>
